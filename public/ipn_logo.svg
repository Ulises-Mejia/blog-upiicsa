<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Arco Superior: baseline en R = 44.6 (texto crece hacia afuera centrado en R = 47.0) -->
    <path id="ipn-arc-top" d="M 15.4,60 A 44.6,44.6 0 0,1 104.6,60" fill="none" />
    <!-- Arco Inferior: baseline en R = 49.0 (texto crece hacia adentro centrado en R = 47.0) -->
    <path id="ipn-arc-bottom" d="M 11.0,60 A 49.0,49.0 0 0,0 109.0,60" fill="none" />
  </defs>

  <!-- Fondo Guinda y Borde Dorado Exterior -->
  <circle cx="60" cy="60" r="56" fill="#6B1D2F" stroke="#D4AF37" stroke-width="3.5"/>
  <!-- Filete dorado fino concéntrico -->
  <circle cx="60" cy="60" r="52.8" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.6"/>
  <!-- Aro interior que enmarca el escudo central -->
  <circle cx="60" cy="60" r="39.5" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.85"/>
  <circle cx="60" cy="60" r="37.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-dasharray="2.5,1.8"/>

  <!-- Puntos separadores laterales -->
  <circle cx="13.0" cy="60" r="1.3" fill="#D4AF37"/>
  <circle cx="107.0" cy="60" r="1.3" fill="#D4AF37"/>

  <!-- Texto Superior -->
  <text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="4.9" font-weight="700" fill="#FFFFFF" letter-spacing="0.45">
    <textPath href="#ipn-arc-top" xlink:href="#ipn-arc-top" startOffset="50%" text-anchor="middle">
      INSTITUTO POLITÉCNICO NACIONAL
    </textPath>
  </text>

  <!-- Texto Inferior -->
  <text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="4.1" font-weight="600" fill="#D4AF37" letter-spacing="0.35">
    <textPath href="#ipn-arc-bottom" xlink:href="#ipn-arc-bottom" startOffset="50%" text-anchor="middle">
      LA TÉCNICA AL SERVICIO DE LA PATRIA
    </textPath>
  </text>

  <!-- Engranaje / Símbolo Politécnico -->
  <path d="M60 26 L63 33 L71 33 L64 38 L67 45 L60 40 L53 45 L56 38 L49 33 L57 33 Z" fill="#D4AF37"/>
  <!-- Tipografía central -->
  <text x="60" y="64" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">IPN</text>
  <text x="60" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="1.5">MÉXICO</text>
</svg>
