<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t122 d122">
  <title id="t122">Escala de Planos Cinematográficos, Angulaciones y Movimientos de Cámara</title>
  <desc id="d122">Diagrama audiovisual dividido en dos paneles: a la izquierda muestra las líneas de corte de la escala de planos sobre la figura humana (Plano Entero, Americano, Medio, Primer Plano, Primerísimo Primer Plano); a la derecha ilustra las cinco angulaciones verticales de cámara (Cenital, Picado, Normal, Contrapicado y Nadir) y los movimientos Pan, Tilt, Dolly y Zoom.</desc>
  <defs>
    <linearGradient id="bg122" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2E1E"/>
      <stop offset="100%" stop-color="#06170E"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="18" fill="url(#bg122)"/>
  <rect x="10" y="10" width="940" height="520" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.32" stroke-width="1.5"/>

  <rect x="34" y="26" width="168" height="24" rx="12" fill="#D4AF37" fill-opacity="0.16" stroke="#D4AF37" stroke-opacity="0.5"/>
  <text x="118" y="42" text-anchor="middle" fill="#D4AF37" font-family="system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="1">UNIDAD I · TEMA 1.2.2</text>
  <text x="480" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="21" font-weight="800">Gramática de Cámara: Escala de Planos y Angulación</text>
  <text x="480" y="68" text-anchor="middle" fill="#9EC2B0" font-family="system-ui,sans-serif" font-size="13">Encuadre expresivo, posición vertical del lente y ejes de movimiento en cine y cámaras 3D</text>

  <!-- Panel Izquierdo: Escala de Planos -->
  <g transform="translate(34,92)">
    <rect width="452" height="402" rx="14" fill="#092116" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="226" y="30" text-anchor="middle" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="15" font-weight="800">Escala de Planos sobre la Figura Humana</text>

    <!-- Silueta estilizada centrada en x=122 -->
    <g transform="translate(74,56)" fill="#00643A" stroke="#6EE7B7" stroke-width="1.8">
      <!-- Cabeza -->
      <circle cx="48" cy="26" r="21"/>
      <!-- Cuello -->
      <rect x="41" y="46" width="14" height="12" rx="4"/>
      <!-- Torso -->
      <path d="M18 68 Q48 56 78 68 L84 156 Q48 164 12 156 Z"/>
      <!-- Brazos -->
      <path d="M18 70 L4 160 Q8 166 15 162 L24 94 Z"/>
      <path d="M78 70 L92 160 Q88 166 81 162 L72 94 Z"/>
      <!-- Piernas -->
      <path d="M18 156 L22 308 L38 308 L45 190 L51 190 L58 308 L74 308 L78 156 Z"/>
    </g>

    <!-- Líneas de corte y etiquetas -->
    <!-- PPP (mentón-frente) -->
    <line x1="60" y1="97" x2="210" y2="97" stroke="#F4E8C1" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="216" y="83" width="218" height="28" rx="6" fill="#0D2F20" stroke="#F4E8C1" stroke-opacity="0.55"/>
    <text x="226" y="101" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="11.5" font-weight="800">PPP</text>
    <text x="260" y="101" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="11.5">Primerísimo Primer Plano</text>

    <!-- PP (hombros) -->
    <line x1="60" y1="136" x2="210" y2="136" stroke="#D4AF37" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="216" y="122" width="218" height="28" rx="6" fill="#0D2F20" stroke="#D4AF37" stroke-opacity="0.65"/>
    <text x="226" y="140" fill="#D4AF37" font-family="system-ui,sans-serif" font-size="11.5" font-weight="800">PP</text>
    <text x="260" y="140" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="11.5">Primer Plano (hombros)</text>

    <!-- PM (cintura) -->
    <line x1="60" y1="208" x2="210" y2="208" stroke="#10B981" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="216" y="194" width="218" height="28" rx="6" fill="#0D2F20" stroke="#10B981" stroke-opacity="0.65"/>
    <text x="226" y="212" fill="#6EE7B7" font-family="system-ui,sans-serif" font-size="11.5" font-weight="800">PM</text>
    <text x="260" y="212" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="11.5">Plano Medio (cintura)</text>

    <!-- PA (rodillas) -->
    <line x1="60" y1="286" x2="210" y2="286" stroke="#10B981" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="216" y="272" width="218" height="28" rx="6" fill="#0D2F20" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="226" y="290" fill="#6EE7B7" font-family="system-ui,sans-serif" font-size="11.5" font-weight="800">PA</text>
    <text x="260" y="290" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="11.5">Plano Americano (rodillas)</text>

    <!-- PE (pies) -->
    <line x1="60" y1="364" x2="210" y2="364" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="216" y="350" width="218" height="28" rx="6" fill="#0D2F20" stroke="#94A3B8" stroke-opacity="0.55"/>
    <text x="226" y="368" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="11.5" font-weight="800">PE</text>
    <text x="260" y="368" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="11.5">Plano Entero (pies a cabeza)</text>

    <text x="122" y="388" text-anchor="middle" fill="#9EC2B0" font-family="system-ui,sans-serif" font-size="10.5">+ GPG / PG (entorno) y PD (objeto)</text>
  </g>

  <!-- Panel Derecho: Angulación y Movimientos -->
  <g transform="translate(506,92)">
    <rect width="420" height="402" rx="14" fill="#092116" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="210" y="30" text-anchor="middle" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="15" font-weight="800">Angulación Vertical y Movimientos</text>

    <!-- Arco de 180° alrededor del sujeto en (110, 178) -->
    <path d="M110 74 A104 104 0 0 1 110 282" fill="none" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="5 4"/>
    <!-- Sujeto central -->
    <circle cx="110" cy="178" r="16" fill="#00643A" stroke="#F4E8C1" stroke-width="2"/>
    <text x="110" y="182" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="10" font-weight="800">SUJ</text>

    <!-- 5 rayos y cámaras -->
    <g stroke="#6EE7B7" stroke-opacity="0.45" stroke-width="1.5">
      <line x1="110" y1="162" x2="110" y2="82"/>
      <line x1="122" y1="166" x2="184" y2="104"/>
      <line x1="126" y1="178" x2="206" y2="178"/>
      <line x1="122" y1="190" x2="184" y2="252"/>
      <line x1="110" y1="194" x2="110" y2="274"/>
    </g>

    <!-- Puntos de cámara y etiquetas -->
    <circle cx="110" cy="74" r="6" fill="#D4AF37"/><text x="128" y="78" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Cenital (+90°)</text>
    <circle cx="184" cy="104" r="6" fill="#D4AF37"/><text x="198" y="108" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Picado (fragilidad)</text>
    <circle cx="214" cy="178" r="7" fill="#10B981"/><text x="228" y="182" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="12.5" font-weight="800">Normal (0° · ojos)</text>
    <circle cx="184" cy="252" r="6" fill="#D4AF37"/><text x="198" y="256" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Contrapicado (poder)</text>
    <circle cx="110" cy="282" r="6" fill="#D4AF37"/><text x="128" y="286" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Nadir (−90°)</text>

    <!-- Caja inferior de Movimientos -->
    <rect x="20" y="308" width="380" height="78" rx="10" fill="#0D2F20" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="36" y="330" fill="#D4AF37" font-family="system-ui,sans-serif" font-size="12" font-weight="800">MOVIMIENTOS Y CONTINUIDAD (RACCORD)</text>
    <text x="36" y="350" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="11.5">• Rotacionales: Pan (horizontal) y Tilt (vertical)</text>
    <text x="36" y="370" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="11.5">• Traslacionales: Travelling / Dolly · Óptico: Zoom · Eje 180°</text>
  </g>

  <text x="480" y="518" text-anchor="middle" fill="#7EA893" font-family="system-ui,sans-serif" font-size="11">Lenguaje audiovisual aplicado a video digital y cámaras virtuales 3D · UPIICSA — IPN</text>
</svg>
