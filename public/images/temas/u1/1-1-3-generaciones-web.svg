<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t113 d113">
  <title id="t113">Las Tres Generaciones de la Multimedia en la World Wide Web</title>
  <desc id="d113">Línea de tiempo comparativa de las tres etapas de la multimedia web: 1991-1995 Web Hipertextual, 1996-2010 Era de Plugins propietarios como Flash y 2010-Actualidad Estándares Abiertos HTML5, WebGL y WebXR.</desc>
  <defs>
    <linearGradient id="bg113" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2E1E"/>
      <stop offset="100%" stop-color="#06170E"/>
    </linearGradient>
    <linearGradient id="line113" gradientUnits="userSpaceOnUse" x1="175" y1="120" x2="785" y2="120">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="18" fill="url(#bg113)"/>
  <rect x="10" y="10" width="940" height="520" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.32" stroke-width="1.5"/>

  <rect x="34" y="26" width="168" height="24" rx="12" fill="#D4AF37" fill-opacity="0.16" stroke="#D4AF37" stroke-opacity="0.5"/>
  <text x="118" y="42" text-anchor="middle" fill="#D4AF37" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" letter-spacing="1">UNIDAD I · TEMA 1.1.3</text>
  <text x="480" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="800">Evolución de la Multimedia en la Web</text>
  <text x="480" y="68" text-anchor="middle" fill="#9EC2B0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13">De la descarga diferida y plugins propietarios a estándares nativos acelerados por GPU</text>

  <!-- Eje temporal -->
  <line x1="95" y1="120" x2="865" y2="120" stroke="url(#line113)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="175" cy="120" r="14" fill="#06170E" stroke="#94A3B8" stroke-width="3.5"/>
  <text x="175" y="125" text-anchor="middle" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12" font-weight="800">1</text>
  <circle cx="480" cy="120" r="14" fill="#06170E" stroke="#D4AF37" stroke-width="3.5"/>
  <text x="480" y="125" text-anchor="middle" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="12" font-weight="800">2</text>
  <circle cx="785" cy="120" r="14" fill="#00643A" stroke="#10B981" stroke-width="3.5"/>
  <text x="785" y="125" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="12" font-weight="800">3</text>

  <!-- Etapa 1 -->
  <g transform="translate(36,154)">
    <rect width="278" height="324" rx="14" fill="#0A2317" stroke="#64748B" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="18" y="18" width="110" height="24" rx="12" fill="#334155"/>
    <text x="73" y="34" text-anchor="middle" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12" font-weight="800">1991 — 1995</text>
    <text x="18" y="66" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="16" font-weight="800">Web Hipertextual</text>
    <text x="18" y="86" fill="#94A3B8" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600">Descarga diferida · HTML 1.0/2.0</text>
    <line x1="18" y1="102" x2="260" y2="102" stroke="#334155" stroke-width="1"/>
    <text x="18" y="128" fill="#CBD5E1" font-family="system-ui,sans-serif" font-size="12.5">• Texto estático e &lt;img&gt; (GIF/JPEG)</text>
    <text x="18" y="152" fill="#CBD5E1" font-family="system-ui,sans-serif" font-size="12.5">• Audio (.wav) y video (.avi) externos</text>
    <text x="18" y="176" fill="#CBD5E1" font-family="system-ui,sans-serif" font-size="12.5">• Sin reproducción en tiempo real</text>
    <rect x="18" y="210" width="242" height="94" rx="10" fill="#071810" stroke="#475569" stroke-opacity="0.5"/>
    <text x="139" y="236" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">&lt;a href="clip.mov"&gt;</text>
    <text x="139" y="256" text-anchor="middle" fill="#64748B" font-family="system-ui,sans-serif" font-size="11">↓ Descargar al disco</text>
    <text x="139" y="282" text-anchor="middle" fill="#CBD5E1" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Reproductor externo</text>
  </g>

  <!-- Etapa 2 -->
  <g transform="translate(341,154)">
    <rect width="278" height="324" rx="14" fill="#0A2317" stroke="#D4AF37" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="18" y="18" width="110" height="24" rx="12" fill="#D4AF37" fill-opacity="0.22" stroke="#D4AF37" stroke-opacity="0.6"/>
    <text x="73" y="34" text-anchor="middle" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="12" font-weight="800">1996 — 2010</text>
    <text x="18" y="66" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="16" font-weight="800">Era de los Plugins</text>
    <text x="18" y="86" fill="#D4AF37" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600">Complementos propietarios</text>
    <line x1="18" y1="102" x2="260" y2="102" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1"/>
    <text x="18" y="128" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12.5">• Flash (SWF), Java Applets, Silverlight</text>
    <text x="18" y="152" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12.5">• Animación vectorial y video embebido</text>
    <text x="18" y="176" fill="#FDBA74" font-family="system-ui,sans-serif" font-size="12.5">• Brechas de seguridad y alto consumo</text>
    <rect x="18" y="210" width="242" height="94" rx="10" fill="#071810" stroke="#D4AF37" stroke-opacity="0.38"/>
    <text x="139" y="236" text-anchor="middle" fill="#F4E8C1" font-family="monospace" font-size="12">&lt;object&gt; / &lt;embed&gt;</text>
    <text x="139" y="258" text-anchor="middle" fill="#D4AF37" font-family="system-ui,sans-serif" font-size="11">↓ Máquina virtual externa</text>
    <text x="139" y="282" text-anchor="middle" fill="#FDBA74" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Dependencia de fabricante</text>
  </g>

  <!-- Etapa 3 -->
  <g transform="translate(646,154)">
    <rect width="278" height="324" rx="14" fill="#0C2E1E" stroke="#10B981" stroke-opacity="0.85" stroke-width="2"/>
    <rect x="18" y="18" width="136" height="24" rx="12" fill="#00643A" stroke="#10B981" stroke-opacity="0.7"/>
    <text x="86" y="34" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="12" font-weight="800">2010 — ACTUALIDAD</text>
    <text x="18" y="66" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="16" font-weight="800">Estándares Abiertos</text>
    <text x="18" y="86" fill="#6EE7B7" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600">W3C / WHATWG · Nativo en navegador</text>
    <line x1="18" y1="102" x2="260" y2="102" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
    <text x="18" y="128" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12.5">• &lt;video&gt;, &lt;audio&gt;, &lt;svg&gt;, &lt;canvas&gt;</text>
    <text x="18" y="152" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12.5">• WebGL / WebGPU · Web Audio API</text>
    <text x="18" y="176" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12.5">• WebRTC (tiempo real) y WebXR (3D)</text>
    <rect x="18" y="210" width="242" height="94" rx="10" fill="#071D13" stroke="#10B981" stroke-opacity="0.55"/>
    <text x="139" y="236" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="12">HTML5 + WebGL + WebXR</text>
    <text x="139" y="258" text-anchor="middle" fill="#D4AF37" font-family="system-ui,sans-serif" font-size="11">↓ Motor nativo + GPU</text>
    <text x="139" y="282" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Multiplataforma y sin plugins</text>
  </g>

  <text x="480" y="512" text-anchor="middle" fill="#7EA893" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11">Remediación e hibridación de medios en la arquitectura Web · UPIICSA — IPN</text>
</svg>
