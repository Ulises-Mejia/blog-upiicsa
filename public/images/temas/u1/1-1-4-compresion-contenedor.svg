<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t114 d114">
  <title id="t114">Compresión Sin Pérdida vs Con Pérdida y Anatomía Contenedor vs Códec</title>
  <desc id="d114">Diagrama técnico dividido en dos paneles: a la izquierda compara la compresión lossless y lossy; a la derecha ilustra cómo un archivo contenedor (MP4, MKV, WebM) empaqueta pistas comprimidas por códecs de video, audio y subtítulos.</desc>
  <defs>
    <linearGradient id="bg114" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2E1E"/>
      <stop offset="100%" stop-color="#06170E"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="18" fill="url(#bg114)"/>
  <rect x="10" y="10" width="940" height="520" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.32" stroke-width="1.5"/>

  <rect x="34" y="26" width="168" height="24" rx="12" fill="#D4AF37" fill-opacity="0.16" stroke="#D4AF37" stroke-opacity="0.5"/>
  <text x="118" y="42" text-anchor="middle" fill="#D4AF37" font-family="system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="1">UNIDAD I · TEMA 1.1.4</text>
  <text x="568" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="20" font-weight="800">Compresión (Lossless / Lossy) y Contenedor vs. Códec</text>
  <text x="480" y="68" text-anchor="middle" fill="#9EC2B0" font-family="system-ui,sans-serif" font-size="13">Equilibrio entre fidelidad perceptual, tasa de compresión y estructura de empaquetado</text>

  <!-- Panel Izquierdo: Compresión -->
  <g transform="translate(34,94)">
    <rect width="430" height="392" rx="14" fill="#092116" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="215" y="34" text-anchor="middle" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="15.5" font-weight="800">1. Estrategias de Compresión</text>

    <!-- Lossless -->
    <rect x="20" y="54" width="390" height="148" rx="12" fill="#0C2E1E" stroke="#10B981" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="34" y="68" width="174" height="24" rx="6" fill="#00643A"/>
    <text x="121" y="84" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="11.5" font-weight="800">SIN PÉRDIDA (LOSSLESS)</text>
    <text x="394" y="84" text-anchor="end" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="700">Reconstrucción 100 %</text>
    <text x="34" y="114" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="12.5">• Elimina redundancia estadística (RLE, LZ77, Huffman)</text>
    <text x="34" y="136" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="12.5">• Recuperación bit a bit exacta del archivo original</text>
    <text x="34" y="160" fill="#9EC2B0" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700">Formatos:</text>
    <rect x="102" y="146" width="52" height="20" rx="5" fill="#10B981" fill-opacity="0.2"/><text x="128" y="160" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="700">PNG</text>
    <rect x="162" y="146" width="56" height="20" rx="5" fill="#10B981" fill-opacity="0.2"/><text x="190" y="160" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="700">FLAC</text>
    <rect x="226" y="146" width="52" height="20" rx="5" fill="#10B981" fill-opacity="0.2"/><text x="252" y="160" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="700">SVG</text>
    <rect x="286" y="146" width="60" height="20" rx="5" fill="#10B981" fill-opacity="0.2"/><text x="316" y="160" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="11" font-weight="700">UTF-8</text>
    <!-- Barra de peso -->
    <rect x="34" y="178" width="230" height="10" rx="5" fill="#10B981"/>
    <rect x="264" y="178" width="130" height="10" rx="5" fill="#10B981" fill-opacity="0.18"/>
    <text x="394" y="187" text-anchor="end" fill="#9EC2B0" font-family="system-ui,sans-serif" font-size="10">2:1 – 4:1</text>

    <!-- Lossy -->
    <rect x="20" y="220" width="390" height="152" rx="12" fill="#13261C" stroke="#D4AF37" stroke-opacity="0.7" stroke-width="1.5"/>
    <rect x="34" y="234" width="160" height="24" rx="6" fill="#D4AF37"/>
    <text x="114" y="250" text-anchor="middle" fill="#00361F" font-family="system-ui,sans-serif" font-size="11.5" font-weight="900">CON PÉRDIDA (LOSSY)</text>
    <text x="394" y="250" text-anchor="end" fill="#F4E8C1" font-family="monospace" font-size="12" font-weight="700">Reducción 10:1 – 100:1</text>
    <text x="34" y="280" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="12.5">• Descarta redundancia psicovisual / psicoacústica</text>
    <text x="34" y="302" fill="#D1E3DA" font-family="system-ui,sans-serif" font-size="12.5">• Transformadas de frecuencia (DCT / MDCT) + cuantificación</text>
    <text x="34" y="326" fill="#9EC2B0" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700">Formatos:</text>
    <rect x="102" y="312" width="52" height="20" rx="5" fill="#D4AF37" fill-opacity="0.2"/><text x="128" y="326" text-anchor="middle" fill="#F4E8C1" font-family="monospace" font-size="11" font-weight="700">AVIF</text>
    <rect x="162" y="312" width="52" height="20" rx="5" fill="#D4AF37" fill-opacity="0.2"/><text x="188" y="326" text-anchor="middle" fill="#F4E8C1" font-family="monospace" font-size="11" font-weight="700">WebP</text>
    <rect x="222" y="312" width="52" height="20" rx="5" fill="#D4AF37" fill-opacity="0.2"/><text x="248" y="326" text-anchor="middle" fill="#F4E8C1" font-family="monospace" font-size="11" font-weight="700">JPEG</text>
    <rect x="282" y="312" width="52" height="20" rx="5" fill="#D4AF37" fill-opacity="0.2"/><text x="308" y="326" text-anchor="middle" fill="#F4E8C1" font-family="monospace" font-size="11" font-weight="700">Opus</text>
    <rect x="342" y="312" width="48" height="20" rx="5" fill="#D4AF37" fill-opacity="0.2"/><text x="366" y="326" text-anchor="middle" fill="#F4E8C1" font-family="monospace" font-size="11" font-weight="700">AV1</text>
    <!-- Barra de peso -->
    <rect x="34" y="346" width="54" height="10" rx="5" fill="#D4AF37"/>
    <rect x="88" y="346" width="306" height="10" rx="5" fill="#D4AF37" fill-opacity="0.16"/>
    <text x="394" y="355" text-anchor="end" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="10">Peso mínimo en red</text>
  </g>

  <!-- Panel Derecho: Contenedor vs Códec -->
  <g transform="translate(496,94)">
    <rect width="430" height="392" rx="14" fill="#092116" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="215" y="34" text-anchor="middle" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="15.5" font-weight="800">2. Anatomía: Contenedor vs. Códec</text>

    <!-- Caja Contenedor -->
    <rect x="22" y="54" width="386" height="318" rx="14" fill="#071911" stroke="#D4AF37" stroke-width="2" stroke-dasharray="8 4"/>
    <rect x="38" y="66" width="354" height="40" rx="8" fill="#00643A" fill-opacity="0.75" stroke="#D4AF37" stroke-opacity="0.6"/>
    <text x="52" y="84" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="13" font-weight="800">CONTENEDOR (La «caja» de empaquetado)</text>
    <text x="52" y="99" fill="#D1E3DA" font-family="monospace" font-size="11">.mp4 (MP4) · .mkv (Matroska) · .webm · .mov</text>

    <!-- Pista 1: Video -->
    <rect x="42" y="122" width="346" height="82" rx="10" fill="#0D2F20" stroke="#10B981" stroke-opacity="0.75" stroke-width="1.5"/>
    <text x="58" y="144" fill="#6EE7B7" font-family="system-ui,sans-serif" font-size="13" font-weight="800">PISTA DE VIDEO — Códec de Compresión</text>
    <text x="58" y="164" fill="#FFFFFF" font-family="monospace" font-size="12">H.264/AVC · H.265/HEVC · VP9 · AV1</text>
    <text x="58" y="186" fill="#9EC2B0" font-family="system-ui,sans-serif" font-size="11.5">Predicción temporal: I-frames (clave), P-frames y B-frames</text>

    <!-- Pista 2: Audio -->
    <rect x="42" y="216" width="346" height="66" rx="10" fill="#0D2F20" stroke="#D4AF37" stroke-opacity="0.65" stroke-width="1.5"/>
    <text x="58" y="238" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="13" font-weight="800">PISTA DE AUDIO — Códec Acústico</text>
    <text x="58" y="260" fill="#FFFFFF" font-family="monospace" font-size="12">AAC · Opus · MP3 · FLAC (Estéreo / 5.1)</text>

    <!-- Pista 3: Subtítulos y Metadatos -->
    <rect x="42" y="294" width="346" height="60" rx="10" fill="#0D2F20" stroke="#64748B" stroke-opacity="0.65" stroke-width="1.5"/>
    <text x="58" y="316" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="13" font-weight="800">SUBTÍTULOS Y METADATOS</text>
    <text x="58" y="338" fill="#B8D4C5" font-family="monospace" font-size="11">WebVTT (.vtt) · SRT · Capítulos · PTS / DTS</text>
  </g>

  <text x="480" y="512" text-anchor="middle" fill="#7EA893" font-family="system-ui,sans-serif" font-size="11">Fundamentos de compresión y empaquetado multimedia · UPIICSA — IPN</text>
</svg>
