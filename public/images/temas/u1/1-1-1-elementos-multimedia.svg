<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t111 d111">
  <title id="t111">Arquitectura de la Multimedia: Tres Pilares y Cinco Elementos Constitutivos</title>
  <desc id="d111">Diagrama radial que muestra los tres pilares técnicos de la multimedia (Digitalización, Interactividad e Hipermedia) rodeados por sus cinco elementos constitutivos: Texto, Imagen, Audio, Video y Animación.</desc>
  <defs>
    <radialGradient id="bg111" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#0D3522"/>
      <stop offset="100%" stop-color="#06170E"/>
    </radialGradient>
    <linearGradient id="gold111" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E8C1"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A6821E"/>
    </linearGradient>
    <linearGradient id="card111" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E3020"/>
      <stop offset="100%" stop-color="#081E13"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="18" fill="url(#bg111)"/>
  <rect x="10" y="10" width="940" height="520" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.32" stroke-width="1.5"/>

  <!-- Encabezado -->
  <rect x="34" y="26" width="168" height="24" rx="12" fill="#D4AF37" fill-opacity="0.16" stroke="#D4AF37" stroke-opacity="0.5"/>
  <text x="118" y="42" text-anchor="middle" fill="#D4AF37" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" letter-spacing="1">UNIDAD I · TEMA 1.1.1</text>
  <text x="480" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="21" font-weight="800">Arquitectura de un Sistema Multimedia Informático</text>
  <text x="480" y="68" text-anchor="middle" fill="#9EC2B0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13">Integración digital de medios estáticos y dinámicos sobre tres pilares técnicos</text>

  <!-- Órbita y conexiones -->
  <circle cx="480" cy="298" r="175" fill="none" stroke="#D4AF37" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 6"/>
  <g stroke="#D4AF37" stroke-opacity="0.48" stroke-width="2">
    <line x1="480" y1="205" x2="480" y2="152"/>
    <line x1="392" y1="262" x2="258" y2="232"/>
    <line x1="568" y1="262" x2="702" y2="232"/>
    <line x1="414" y1="364" x2="298" y2="416"/>
    <line x1="546" y1="364" x2="662" y2="416"/>
  </g>

  <!-- Núcleo central: 3 Pilares -->
  <circle cx="480" cy="298" r="98" fill="#072215" stroke="url(#gold111)" stroke-width="2.5"/>
  <circle cx="480" cy="298" r="88" fill="none" stroke="#00643A" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="480" y="254" text-anchor="middle" fill="#D4AF37" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">TRES PILARES</text>
  <rect x="411" y="266" width="138" height="24" rx="6" fill="#00643A" fill-opacity="0.6" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="480" y="282" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700">1. Digitalización (Bits)</text>
  <rect x="411" y="296" width="138" height="24" rx="6" fill="#00643A" fill-opacity="0.6" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="480" y="312" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700">2. Interactividad</text>
  <rect x="411" y="326" width="138" height="24" rx="6" fill="#00643A" fill-opacity="0.6" stroke="#10B981" stroke-opacity="0.5"/>
  <text x="480" y="342" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700">3. Hipermedia</text>

  <!-- 1. Texto (Arriba) -->
  <g transform="translate(352,88)">
    <rect width="256" height="66" rx="12" fill="url(#card111)" stroke="#D4AF37" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="12" y="13" width="40" height="40" rx="8" fill="#00643A"/>
    <text x="32" y="40" text-anchor="middle" fill="#F4E8C1" font-family="Georgia,serif" font-size="22" font-weight="800">Aa</text>
    <text x="64" y="28" fill="#F4E8C1" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="800">Texto e Hipertexto</text>
    <text x="64" y="46" fill="#B8D4C5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5">UTF-8 · Tipografía · Nodos UI</text>
    <rect x="200" y="10" width="46" height="16" rx="8" fill="#10B981" fill-opacity="0.22"/>
    <text x="223" y="21" text-anchor="middle" fill="#6EE7B7" font-family="system-ui,sans-serif" font-size="9" font-weight="700">ESTÁTICO</text>
  </g>

  <!-- 2. Imagen (Izquierda superior) -->
  <g transform="translate(36,192)">
    <rect width="234" height="86" rx="12" fill="url(#card111)" stroke="#D4AF37" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="14" y="18" width="44" height="44" rx="8" fill="#00643A"/>
    <rect x="22" y="26" width="28" height="22" rx="3" fill="none" stroke="#F4E8C1" stroke-width="2"/>
    <circle cx="30" cy="33" r="2.6" fill="#D4AF37"/>
    <path d="M24 46 L33 37 L40 43 L44 39 L48 46 Z" fill="#6EE7B7"/>
    <text x="70" y="34" fill="#F4E8C1" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="800">Imagen y Gráficos</text>
    <text x="70" y="52" fill="#B8D4C5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5">Mapas de bits (M×N)</text>
    <text x="70" y="68" fill="#B8D4C5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5">y Vectores (Bézier)</text>
  </g>

  <!-- 3. Audio (Derecha superior) -->
  <g transform="translate(690,192)">
    <rect width="234" height="86" rx="12" fill="url(#card111)" stroke="#D4AF37" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="14" y="18" width="44" height="44" rx="8" fill="#00643A"/>
    <g stroke="#F4E8C1" stroke-width="2.5" stroke-linecap="round">
      <line x1="24" y1="36" x2="24" y2="44"/>
      <line x1="30" y1="29" x2="30" y2="51"/>
      <line x1="36" y1="24" x2="36" y2="56"/>
      <line x1="42" y1="31" x2="42" y2="49"/>
      <line x1="48" y1="36" x2="48" y2="44"/>
    </g>
    <text x="70" y="34" fill="#F4E8C1" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="800">Audio Digital</text>
    <text x="70" y="52" fill="#B8D4C5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5">Voz · Música · Foley</text>
    <text x="70" y="68" fill="#6EE7B7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700">MEDIO CONTINUO</text>
  </g>

  <!-- 4. Video (Izquierda inferior) -->
  <g transform="translate(86,398)">
    <rect width="244" height="86" rx="12" fill="url(#card111)" stroke="#D4AF37" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="14" y="18" width="44" height="44" rx="8" fill="#00643A"/>
    <rect x="21" y="29" width="22" height="18" rx="3" fill="none" stroke="#F4E8C1" stroke-width="2"/>
    <polygon points="44,34 52,29 52,47 44,42" fill="#D4AF37"/>
    <text x="70" y="34" fill="#F4E8C1" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="800">Video Digital</text>
    <text x="70" y="52" fill="#B8D4C5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5">Secuencias 24–60 FPS</text>
    <text x="70" y="68" fill="#B8D4C5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5">+ pistas sincronizadas</text>
  </g>

  <!-- 5. Animación (Derecha inferior) -->
  <g transform="translate(630,398)">
    <rect width="244" height="86" rx="12" fill="url(#card111)" stroke="#D4AF37" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect x="14" y="18" width="44" height="44" rx="8" fill="#00643A"/>
    <path d="M22 50 Q36 22 50 48" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="24" cy="48" r="4" fill="#6EE7B7" fill-opacity="0.45"/>
    <circle cx="36" cy="33" r="5" fill="#6EE7B7" fill-opacity="0.75"/>
    <circle cx="48" cy="45" r="5.5" fill="#F4E8C1"/>
    <text x="70" y="34" fill="#F4E8C1" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="800">Animación 2D / 3D</text>
    <text x="70" y="52" fill="#B8D4C5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5">Transformación temporal</text>
    <text x="70" y="68" fill="#B8D4C5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5">de modelos y gráficos</text>
  </g>

  <!-- Leyenda inferior -->
  <text x="480" y="514" text-anchor="middle" fill="#7EA893" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11">Repositorio Digital de Herramientas Multimedia · UPIICSA — IPN</text>
</svg>
