<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t124 d124">
  <title id="t124">Conversión Analógico-Digital PCM (Teorema de Nyquist) y Análisis Espectral FFT</title>
  <desc id="d124">Diagrama científico de procesamiento digital de audio en dos paneles: arriba muestra una onda analógica continua muestreada y cuantificada en niveles discretos PCM bajo el teorema de Nyquist (fs mayor o igual a 2 fmax); abajo muestra su descomposición mediante FFT al dominio de la frecuencia con filtros pasa-altas y rechaza-banda.</desc>
  <defs>
    <linearGradient id="bg124" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2E1E"/>
      <stop offset="100%" stop-color="#06170E"/>
    </linearGradient>
    <marker id="arr124" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#D4AF37"/>
    </marker>
  </defs>

  <rect width="960" height="540" rx="18" fill="url(#bg124)"/>
  <rect x="10" y="10" width="940" height="520" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.32" stroke-width="1.5"/>

  <rect x="34" y="26" width="168" height="24" rx="12" fill="#D4AF37" fill-opacity="0.16" stroke="#D4AF37" stroke-opacity="0.5"/>
  <text x="118" y="42" text-anchor="middle" fill="#D4AF37" font-family="system-ui,sans-serif" font-size="11" font-weight="800" letter-spacing="1">UNIDAD I · TEMA 1.2.4</text>
  <text x="568" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="20" font-weight="800">Muestreo PCM (Nyquist) y Dominio Frecuencial (FFT)</text>
  <text x="480" y="68" text-anchor="middle" fill="#9EC2B0" font-family="system-ui,sans-serif" font-size="13">Del muestreo temporal de ondas de presión al análisis espectral y filtrado digital</text>

  <!-- Panel Izquierdo: Dominio del Tiempo (ADC / PCM / Nyquist) -->
  <g transform="translate(34,94)">
    <rect width="430" height="392" rx="14" fill="#092116" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="215" y="32" text-anchor="middle" fill="#6EE7B7" font-family="system-ui,sans-serif" font-size="15" font-weight="800">1. Dominio del Tiempo · Muestreo PCM</text>

    <!-- Gráfica -->
    <rect x="26" y="48" width="378" height="196" rx="10" fill="#06160E" stroke="#10B981" stroke-opacity="0.3"/>
    <!-- Rejilla de cuantificación -->
    <g stroke="#10B981" stroke-opacity="0.14" stroke-width="1">
      <line x1="48" y1="80" x2="390" y2="80"/>
      <line x1="48" y1="112" x2="390" y2="112"/>
      <line x1="48" y1="146" x2="390" y2="146" stroke-opacity="0.45"/>
      <line x1="48" y1="180" x2="390" y2="180"/>
      <line x1="48" y1="212" x2="390" y2="212"/>
    </g>
    <line x1="48" y1="62" x2="48" y2="230" stroke="#9EC2B0" stroke-width="1.5"/>
    <text x="36" y="76" fill="#9EC2B0" font-family="monospace" font-size="10">+A</text>
    <text x="38" y="150" fill="#9EC2B0" font-family="monospace" font-size="10">0</text>
    <text x="36" y="220" fill="#9EC2B0" font-family="monospace" font-size="10">-A</text>
    <text x="378" y="236" text-anchor="end" fill="#9EC2B0" font-family="system-ui,sans-serif" font-size="10.5">Tiempo (t)</text>

    <!-- Onda analógica senoidal continua -->
    <path d="M48 146 C 72 62, 114 62, 138 146 C 162 230, 204 230, 228 146 C 252 62, 294 62, 318 146 C 342 230, 368 230, 386 154" fill="none" stroke="#6EE7B7" stroke-opacity="0.55" stroke-width="2.5"/>

    <!-- Muestras discretas (stems dorados) -->
    <g stroke="#D4AF37" stroke-width="2">
      <line x1="66" y1="146" x2="66" y2="96"/>
      <line x1="93" y1="146" x2="93" y2="82"/>
      <line x1="120" y1="146" x2="120" y2="108"/>
      <line x1="147" y1="146" x2="147" y2="174"/>
      <line x1="174" y1="146" x2="174" y2="208"/>
      <line x1="201" y1="146" x2="201" y2="196"/>
      <line x1="228" y1="146" x2="228" y2="146"/>
      <line x1="255" y1="146" x2="255" y2="96"/>
      <line x1="282" y1="146" x2="282" y2="82"/>
      <line x1="309" y1="146" x2="309" y2="114"/>
      <line x1="336" y1="146" x2="336" y2="188"/>
      <line x1="363" y1="146" x2="363" y2="208"/>
    </g>
    <g fill="#F4E8C1" stroke="#06170E" stroke-width="1.2">
      <circle cx="66" cy="96" r="4.5"/><circle cx="93" cy="82" r="4.5"/><circle cx="120" cy="108" r="4.5"/>
      <circle cx="147" cy="174" r="4.5"/><circle cx="174" cy="208" r="4.5"/><circle cx="201" cy="196" r="4.5"/>
      <circle cx="228" cy="146" r="4.5"/><circle cx="255" cy="96" r="4.5"/><circle cx="282" cy="82" r="4.5"/>
      <circle cx="309" cy="114" r="4.5"/><circle cx="336" cy="188" r="4.5"/><circle cx="363" cy="208" r="4.5"/>
    </g>

    <!-- Leyenda fórmulas -->
    <rect x="26" y="258" width="378" height="116" rx="10" fill="#0D2F20" stroke="#D4AF37" stroke-opacity="0.45"/>
    <text x="42" y="282" fill="#D4AF37" font-family="system-ui,sans-serif" font-size="13" font-weight="800">Teorema de Nyquist-Shannon: fs ≥ 2 · fmáx</text>
    <text x="42" y="304" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12">• Audible: 20 Hz – 20 kHz → CD: 44.1 kHz / Video: 48 kHz</text>
    <text x="42" y="326" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12">• Profundidad de bits: 16-bit (96 dB) · 24-bit (144 dB)</text>
    <text x="42" y="350" fill="#FDBA74" font-family="system-ui,sans-serif" font-size="11.5">Si fs &lt; 2·fmáx aparece aliasing (tonos fantasma)</text>
  </g>

  <!-- Flecha FFT central -->
  <g transform="translate(466,246)">
    <line x1="2" y1="22" x2="24" y2="22" stroke="#D4AF37" stroke-width="2.5" marker-end="url(#arr124)"/>
    <rect x="-4" y="-12" width="36" height="22" rx="6" fill="#D4AF37"/>
    <text x="14" y="3" text-anchor="middle" fill="#00361F" font-family="monospace" font-size="11" font-weight="900">FFT</text>
  </g>

  <!-- Panel Derecho: Dominio de la Frecuencia (Espectro + Filtros) -->
  <g transform="translate(496,94)">
    <rect width="430" height="392" rx="14" fill="#092116" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="215" y="32" text-anchor="middle" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="15" font-weight="800">2. Dominio de la Frecuencia · Espectro FFT</text>

    <!-- Gráfica espectral -->
    <rect x="26" y="48" width="378" height="196" rx="10" fill="#06160E" stroke="#D4AF37" stroke-opacity="0.35"/>
    <!-- Zona atenuada pasa-altas < 80Hz -->
    <rect x="46" y="58" width="44" height="162" fill="#EF4444" fill-opacity="0.14"/>
    <text x="68" y="74" text-anchor="middle" fill="#FCA5A5" font-family="system-ui,sans-serif" font-size="9.5" font-weight="700">HPF</text>
    <text x="68" y="86" text-anchor="middle" fill="#FCA5A5" font-family="monospace" font-size="9">&lt;80Hz</text>

    <!-- Barras espectrales -->
    <g fill="#00643A" stroke="#6EE7B7" stroke-width="1">
      <rect x="54" y="190" width="14" height="30" rx="2" fill="#EF4444" fill-opacity="0.5" stroke="#FCA5A5"/>
      <rect x="74" y="176" width="14" height="44" rx="2" fill="#EF4444" fill-opacity="0.5" stroke="#FCA5A5"/>
      <rect x="102" y="136" width="16" height="84" rx="2"/>
      <rect x="126" y="92" width="16" height="128" rx="2" fill="#D4AF37" stroke="#F4E8C1"/>
      <rect x="150" y="114" width="16" height="106" rx="2"/>
      <rect x="174" y="128" width="16" height="92" rx="2"/>
      <rect x="198" y="104" width="16" height="116" rx="2" fill="#D4AF37" stroke="#F4E8C1"/>
      <rect x="222" y="142" width="16" height="78" rx="2"/>
      <rect x="246" y="152" width="16" height="68" rx="2"/>
      <rect x="270" y="124" width="16" height="96" rx="2"/>
      <rect x="294" y="164" width="16" height="56" rx="2"/>
      <rect x="318" y="178" width="16" height="42" rx="2"/>
      <rect x="342" y="190" width="16" height="30" rx="2"/>
      <rect x="366" y="200" width="16" height="20" rx="2"/>
    </g>
    <!-- Curva de respuesta de filtro -->
    <path d="M48 214 Q86 212 102 104 L344 104 Q370 106 388 184" fill="none" stroke="#F4E8C1" stroke-width="2" stroke-dasharray="5 3"/>

    <line x1="46" y1="220" x2="392" y2="220" stroke="#9EC2B0" stroke-width="1.5"/>
    <text x="56" y="236" fill="#9EC2B0" font-family="monospace" font-size="9.5">20Hz</text>
    <text x="152" y="236" fill="#9EC2B0" font-family="monospace" font-size="9.5">500Hz</text>
    <text x="248" y="236" fill="#9EC2B0" font-family="monospace" font-size="9.5">4kHz</text>
    <text x="358" y="236" fill="#9EC2B0" font-family="monospace" font-size="9.5">20kHz</text>

    <!-- Caja inferior de operaciones DSP -->
    <rect x="26" y="258" width="378" height="116" rx="10" fill="#0D2F20" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="42" y="282" fill="#6EE7B7" font-family="system-ui,sans-serif" font-size="13" font-weight="800">Operaciones DSP en Producción Multimedia</text>
    <text x="42" y="304" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12">• Ecualización (HPF &lt; 80 Hz, LPF, Notch 60 Hz)</text>
    <text x="42" y="326" fill="#E2E8F0" font-family="system-ui,sans-serif" font-size="12">• Compresión dinámica y sustracción espectral de ruido</text>
    <text x="42" y="350" fill="#F4E8C1" font-family="system-ui,sans-serif" font-size="12">• Audio espacial 3D y binaural (HRTF en motores XR)</text>
  </g>

  <text x="480" y="512" text-anchor="middle" fill="#7EA893" font-family="system-ui,sans-serif" font-size="11">Procesamiento Digital de Audio (DSP) · UPIICSA — IPN</text>
</svg>
