<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Arco Superior: baseline en R = 44.85 (texto crece hacia afuera centrado en R = 47.0) -->
    <path id="upiicsa-arc-top" d="M 15.15,60 A 44.85,44.85 0 0,1 104.85,60" fill="none" />
    <!-- Arco Inferior: baseline en R = 48.65 (texto crece hacia adentro centrado en R = 47.0) -->
    <path id="upiicsa-arc-bottom" d="M 11.35,60 A 48.65,48.65 0 0,0 108.65,60" fill="none" />
  </defs>

  <!-- Fondo Verde UPIICSA y Borde Dorado Exterior -->
  <circle cx="60" cy="60" r="56" fill="#00643A" stroke="#D4AF37" stroke-width="3.5"/>
  <!-- Filete dorado fino concéntrico -->
  <circle cx="60" cy="60" r="52.8" fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.6"/>
  <!-- Aro interior que enmarca el emblema central -->
  <circle cx="60" cy="60" r="39.5" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.85"/>
  <circle cx="60" cy="60" r="37.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-dasharray="2.5,1.8"/>

  <!-- Puntos separadores laterales -->
  <circle cx="13.0" cy="60" r="1.3" fill="#D4AF37"/>
  <circle cx="107.0" cy="60" r="1.3" fill="#D4AF37"/>

  <!-- Texto Superior Completo -->
  <text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="4.3" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">
    <textPath href="#upiicsa-arc-top" xlink:href="#upiicsa-arc-top" startOffset="50%" text-anchor="middle">
      UNIDAD PROFESIONAL INTERDISCIPLINARIA
    </textPath>
  </text>

  <!-- Texto Inferior Completo -->
  <text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="3.2" font-weight="600" fill="#D4AF37" letter-spacing="0.12">
    <textPath href="#upiicsa-arc-bottom" xlink:href="#upiicsa-arc-bottom" startOffset="50%" text-anchor="middle">
      DE INGENIERÍA Y CIENCIAS SOCIALES Y ADMINISTRATIVAS
    </textPath>
  </text>

  <!-- Rombo Interdisciplinario Central -->
  <polygon points="60,25 72,37 60,49 48,37" fill="#D4AF37" opacity="0.95"/>
  <polygon points="60,30 66,37 60,44 54,37" fill="#00643A"/>

  <!-- Tipografía central -->
  <text x="60" y="64" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">UPIICSA</text>
  <text x="60" y="75" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="6" font-weight="700" fill="#D4AF37" text-anchor="middle" letter-spacing="1">IPN</text>
</svg>
